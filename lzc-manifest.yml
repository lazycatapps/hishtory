# app 的唯一 id,上架到商店需要保证不要冲突,尽量使用开发者自己的域名作为后缀.
package: cloud.lazycat.app.liu.hishtory
# app 的版本
version: 0.335.0-1

name: hiSHtory
# 搜索关键词,使用逗号进行分隔
keywords: history,sync,terminal,hishtory
description: Self-hosted hiSHtory server for sharing shell history across devices.

# 软件名称,会显示在启动器之类的地方
locales:
  zh:
    name: hiSHtory 历史同步服务
    description: |
      ## hiSHtory 自建同步服务

      **官方网站：** https://hishtory.dev
      **仓库地址：** https://github.com/lazycatapps/hishtory.git

      hiSHtory 是一个开源的 Shell 历史同步工具，本项目将其移植到懒猫微服平台，帮助你在多台终端之间安全共享命令历史。采用端到端加密，服务器无法解密命令内容，确保隐私安全。

      ## 服务器部署

      在懒猫微服中安装本应用并启动服务，等待容器初始化完成。

      ### 数据库存储

      本方案默认使用 PostgreSQL 作为后端数据库，以避免 SQLite 在高并发下触发“database is locked”报错并提升多终端同步的稳定性。若先前使用 SQLite：

      - 备份旧的 `/config/hishtory.db`，在每台客户端执行 `hishtory reupload` 重新上传历史；
      - 或使用社区工具将 SQLite 数据导出后导入 PostgreSQL，再启动服务。

      ## 客户端安装

      在每台需要同步的机器上安装 hiSHtory 客户端，可选以下方式：

      1. **官方安装脚本（推荐）**
         ```bash
         curl https://hishtory.dev/install.py | python3 -
         ```

      2. **手动下载二进制**
         访问 https://github.com/ddworken/hishtory/releases 下载对应操作系统的压缩包，解压后将可执行文件放入 `~/bin` 或 `/usr/local/bin`，然后执行 `hishtory install`

      安装过程中会生成密钥（Secret Key），请妥善保存，其他设备使用 `hishtory init <密钥>` 加入同步组。

      ## 配置服务器地址

      在每台设备的 Shell 配置文件（如 `~/.zshrc` 或 `~/.bashrc`）中添加环境变量：

      ```bash
      export HISHTORY_SERVER=https://hishtory.${LAZYCAT_BOX_NAME}.heiyu.space
      ```

      刷新终端后使用 `echo $HISHTORY_SERVER` 确认是否生效。

      ## 常用命令

      - **初始化绑定密钥:** `hishtory init <密钥>`
      - **查看状态:** `hishtory status`
      - **立即同步:** `hishtory reupload`
      - **查询历史:** `hishtory query --tail 20`
      - **按主机查看:** `hishtory query --host <主机名>`
      - **临时关闭同步:** `hishtory syncing disable`
      - **重新安装 Hook:** `hishtory install`
      - **启动 Web UI:** `hishtory start-web-ui`

      ## 验证同步

      1. 在机器 A 执行 `echo hello-from-A`
      2. 运行 `hishtory reupload` 强制上传
      3. 在机器 B 执行 `hishtory query 'hello-from-A'`，若能看到该命令则同步成功

      ## 安全与隐私

      - 采用端到端加密，服务器无法解密命令内容
      - 命令前加空格可跳过记录
      - 使用 `hishtory syncing disable` 临时暂停记录

      ## 常见问题

      - **历史停滞:** 确认 Shell 配置文件中 `source ~/.hishtory/config.*`，重新执行 `hishtory install`
      - **密钥丢失:** 从已配置设备运行 `hishtory status` 查看
      - **服务器无法访问:** 检查网络连通性或确认服务运行状态
      - **排查日志:** `tail -f ~/.hishtory/hishtory.log`

  en:
    name: hiSHtory Sync Service
    description: |
      ## Self-hosted hiSHtory Server

      **Official Site:** https://hishtory.dev
      **Repository:** https://github.com/lazycatapps/hishtory.git

      hiSHtory is an open-source shell history sync tool. This project ports it to Lazycat Cloud platform, helping you securely share command history across multiple terminals. It uses end-to-end encryption, ensuring the server cannot decrypt command contents.

      ## Server Deployment

      Install this app in Lazycat Cloud and start the service.

      ### Database Storage

      The manifest defaults to PostgreSQL to avoid SQLite “database is locked” contention and improve reliability for multi-device sync. If you previously used SQLite:

      - Back up the old `/config/hishtory.db`, then run `hishtory reupload` on each client to republish history.
      - Or export from SQLite and import into PostgreSQL with community tooling before starting the new service.

      ## Client Installation

      Install the hiSHtory client on each machine that needs sync. Choose one of the following methods:

      1. **Official Install Script (Recommended)**
         ```bash
         curl https://hishtory.dev/install.py | python3 -
         ```

      2. **Manual Binary Download**
         Visit https://github.com/ddworken/hishtory/releases to download the archive for your OS, extract it, place the executable in `~/bin` or `/usr/local/bin`, then run `hishtory install`

      During installation, a secret key will be generated. Save it securely. Other devices use `hishtory init <secret-key>` to join the sync group.

      ## Configure Server Address

      Add the environment variable to your shell config file (e.g., `~/.zshrc` or `~/.bashrc`):

      ```bash
      export HISHTORY_SERVER=https://hishtory.${LAZYCAT_BOX_NAME}.heiyu.space
      ```

      Refresh your terminal and use `echo $HISHTORY_SERVER` to confirm it's set.

      ## Common Commands

      - **Initialize with key:** `hishtory init <secret-key>`
      - **Check status:** `hishtory status`
      - **Sync immediately:** `hishtory reupload`
      - **Query history:** `hishtory query --tail 20`
      - **View by host:** `hishtory query --host <hostname>`
      - **Disable sync:** `hishtory syncing disable`
      - **Reinstall hooks:** `hishtory install`
      - **Start Web UI:** `hishtory start-web-ui`

      ## Verify Sync

      1. On machine A, run `echo hello-from-A`
      2. Execute `hishtory reupload` to force upload
      3. On machine B, run `hishtory query 'hello-from-A'`. If you see the command, sync is successful.

      ## Security & Privacy

      - Uses end-to-end encryption; server cannot decrypt command contents
      - Add space before command to skip recording
      - Use `hishtory syncing disable` to temporarily pause recording

      ## Troubleshooting

      - **History stalled:** Confirm `source ~/.hishtory/config.*` in shell config, re-run `hishtory install`
      - **Lost secret key:** Run `hishtory status` on any configured device
      - **Server unreachable:** Check network connectivity or verify service status
      - **Debug logs:** `tail -f ~/.hishtory/hishtory.log`

# 软件本身的 license
license: https://choosealicense.com/licenses/mit/

# 软件的主页,会在商店等地方体现
homepage: https://hishtory.dev

# lpk 的作者,会在商店等地方体现
author: liu

# application 作为一个特殊的 container 运行，对应的 service 名称为固定的`app`， 其他 service 可以通过此名称与 app 进行通讯
application:
  #是否存在后台任务， 若存在则系统不会对此 app 进行主动休眠等操作
  background_task: true

  # 期望的 app 域名，如果系统中已经有对应域名则会提示用户选择其他域名。 最终 app 分配到的域名以/lzcapp/run/app.subdomain 为准
  subdomain: hishtory

  routes:
    - /=file:///lzcapp/pkg/content/
    - /api/=http://hishtory-server:8080/api/

  public_path:
    - /                         # 无需登录即可访问

  depends_on:
    - hishtory-server

  # 是否启用多实例
  multi_instance: false

services:
  hishtory-server:
    # lzc-cli appstore copy-image lscr.io/linuxserver/hishtory-server:latest
    # 说明：服务器端默认改用 PostgreSQL，避免 SQLite 并发锁 (database is locked) 问题，并提升多终端同步场景的稳定性。
    # Note: switch to PostgreSQL to avoid SQLite concurrency locks (“database is locked”) and improve reliability for multi-device sync.
    image: registry.lazycat.cloud/liu/linuxserver/hishtory-server:12bae50b16ac83cc
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Shanghai
      - HISHTORY_POSTGRES_DB=postgresql://hishtory:hishtory@postgres:5432/hishtory?sslmode=disable
      # - HISHTORY_SQLITE_DB=/config/hishtory.db
    depends_on:
      - postgres
    binds:
      - /lzcapp/var/config:/config
    health_check:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:8080/healthcheck || exit 1
      start_period: 30s
  postgres:
    # lzc-cli appstore copy-image postgres:17-alpine
    image: registry.lazycat.cloud/liu/library/postgres:cf54e1c33a8a3b2d
    environment:
      - POSTGRES_DB=hishtory
      - POSTGRES_USER=hishtory
      - POSTGRES_PASSWORD=hishtory
    binds:
      - /lzcapp/var/data/postgresql:/var/lib/postgresql/data
    health_check:
      test:
        - CMD-SHELL
        - pg_isready -d hishtory -U hishtory
      start_period: 30s
    # 旧 SQLite 数据迁移提示：
    # 1. 备份原 /config/hishtory.db，使用客户端运行 `hishtory reupload` 重新上传历史；
    # 2. 或者参考社区工具，将 SQLite 导出后导入 PostgreSQL，再启动新的服务。
    # Legacy SQLite migration tips:
    # 1. Backup /config/hishtory.db and run `hishtory reupload` on each client to republish history.
    # 2. Or export from SQLite and import into PostgreSQL with community tools before starting the new service.
